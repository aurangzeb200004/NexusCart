    const SAMPLE_IMAGE_PRESETS = [

    ];

    const CURRENCIES = {
      USD: { symbol: '$', rate: 1.0, label: 'USD ($)', code: 'USD' },
      EUR: { symbol: '€', rate: 0.92, label: 'EUR (€)', code: 'EUR' },
      GBP: { symbol: '£', rate: 0.79, label: 'GBP (£)', code: 'GBP' },
      PKR: { symbol: '₨', rate: 278.5, label: 'PKR (₨)', code: 'PKR' }
    };

    const ORDER_STEPS = [
      { title: 'Order Placed & Split Paid', desc: 'Stripe Transfer Group split settled instantly.' },
      { title: 'Vendor Packed & Verified', desc: 'Barcoded by merchant with digital invoice.' },
      { title: 'In Transit (DHL Express)', desc: 'Dispatched to international air cargo hub.' },
      { title: 'Out for Local Delivery', desc: 'Courier van dispatched to recipient address.' },
      { title: 'Delivered & Settled', desc: 'Package signed for; merchant escrow released.' }
    ];

    // Local Storage Helpers
    const loadStorage = (key, fallback) => {
      try {
        const item = localStorage.getItem(`nexuscart_${key}`);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    };
    const saveStorage = (key, val) => {
      try {
        localStorage.setItem(`nexuscart_${key}`, JSON.stringify(val));
      } catch (e) {}
    };

    // ============================================================================
    // MAIN REACT APPLICATION COMPONENT (LIGHT THEME)
    // ============================================================================
    function NexusCartApp() {
      // Navigation
      const [activeView, setActiveView] = useState('storefront'); // storefront | vendor | orders | architecture
      
      // Persisted Application State
      const [currency, setCurrency] = useState(() => loadStorage('currency', 'USD'));
      const [vendors, setVendors] = useState(() => loadStorage('vendors', INITIAL_VENDORS));
      const [products, setProducts] = useState(() => loadStorage('products', INITIAL_PRODUCTS));
      const [cart, setCart] = useState(() => loadStorage('cart', [
        { productId: 'prod_1', qty: 1 },
        { productId: 'prod_3', qty: 1 }
      ]));
      const [orders, setOrders] = useState(() => loadStorage('orders', [
        {
          id: 'NX-90412',
          createdAt: 'Oct 31, 2026 • 14:22 UTC',
          customerEmail: 'alex.mercer@studio.io',
          stepIndex: 2,
          refunded: false,
          currency: 'USD',
          trackingNumber: 'DHL-EXP-90412-88X',
          totalUsd: 784,
          platformFeeUsd: 19.60,
          vendorSplits: [
            { vendorId: 'v_aether', vendorName: 'Aether Audio Lab', stripeAccountId: 'acct_aether_99x', grossUsd: 499, netPayoutUsd: 486.525 },
            { vendorId: 'v_kuro', vendorName: 'Kuro Minimalist Gear', stripeAccountId: 'acct_kuro_42k', grossUsd: 285, netPayoutUsd: 277.875 }
          ],
          items: [
            { title: 'Aether Reference Planar Headphones', qty: 1, priceUsd: 499, vendorId: 'v_aether' },
            { title: 'Kuro Monolith 75% Mechanical Keyboard', qty: 1, priceUsd: 285, vendorId: 'v_kuro' }
          ]
        }
      ]));

      // Save to localStorage on state mutations
      useEffect(() => { saveStorage('currency', currency); }, [currency]);
      useEffect(() => { saveStorage('vendors', vendors); }, [vendors]);
      useEffect(() => { saveStorage('products', products); }, [products]);
      useEffect(() => { saveStorage('cart', cart); }, [cart]);
      useEffect(() => { saveStorage('orders', orders); }, [orders]);

      // Storefront Filter States
      const [selectedTenant, setSelectedTenant] = useState('all');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('featured');
      const [quickViewProduct, setQuickViewProduct] = useState(null);

      // Cart & Checkout
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [checkoutStep, setCheckoutStep] = useState(null); // null | 'processing' | 'done'
      const [checkoutCustomerEmail, setCheckoutCustomerEmail] = useState('customer@nexuscart.dev');
      const [paymentMethod, setPaymentMethod] = useState('stripe_card');

      // Vendor Portal
      const [managedVendorId, setManagedVendorId] = useState('v_aether');
      const [showAddProductModal, setShowAddProductModal] = useState(false);
      const [newProdForm, setNewProdForm] = useState({
        title: '',
        sku: '',
        category: 'Audio',
        priceUsd: 199,
        stock: 25,
        specsStr: 'CNC Anodized Finish, High Precision Engineering, Global Warranty',
        image: 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?q=80&w=800&auto=format&fit=crop'
      });
      const [vendorSearch, setVendorSearch] = useState('');

      // Architecture tab sub-view
      const [archTab, setArchTab] = useState('schema'); // schema | stripe | meilisearch | simulator

      // Order Modal
      const [invoiceModalOrder, setInvoiceModalOrder] = useState(null);

      // Toast Notification
      const [toast, setToast] = useState(null);
      const triggerToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3800);
      };

      // Currency Formatting Helper
      const formatPrice = (usdAmount, targetCurrency = currency) => {
        const c = CURRENCIES[targetCurrency] || CURRENCIES.USD;
        const converted = usdAmount * c.rate;
        if (targetCurrency === 'PKR') {
          return `${c.symbol}${Math.round(converted).toLocaleString()}`;
        }
        return `${c.symbol}${converted.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      };

      // Simulated MeiliSearch Latency calculation
      const searchLatencyMs = useMemo(() => {
        const base = 0.72;
        const jitter = (searchQuery.length * 0.08) + (selectedTenant !== 'all' ? 0.12 : 0.04);
        return (base + jitter).toFixed(2);
      }, [searchQuery, selectedCategory, selectedTenant]);

      // Instant MeiliSearch Filtered Products
      const filteredProducts = useMemo(() => {
        return products
          .filter(p => selectedTenant === 'all' || p.vendorId === selectedTenant)
          .filter(p => selectedCategory === 'All' || p.category === selectedCategory)
          .filter(p => {
            if (!searchQuery.trim()) return true;
            const q = searchQuery.toLowerCase().trim();
            return (
              p.title.toLowerCase().includes(q) ||
              p.sku.toLowerCase().includes(q) ||
              p.category.toLowerCase().includes(q) ||
              (p.specs && p.specs.some(s => s.toLowerCase().includes(q)))
            );
          })
          .sort((a, b) => {
            if (sortBy === 'price-asc') return a.priceUsd - b.priceUsd;
            if (sortBy === 'price-desc') return b.priceUsd - a.priceUsd;
            if (sortBy === 'rating') return b.rating - a.rating;
            if (sortBy === 'stock') return b.stock - a.stock;
            return 0; // featured default
          });
      }, [products, selectedTenant, selectedCategory, searchQuery, sortBy]);

      // Cart Calculations & Multi-Vendor Stripe Split Breakdown
      const cartDetails = useMemo(() => {
        const enriched = cart.map(item => {
          const product = products.find(p => p.id === item.productId);
          const vendor = vendors.find(v => v.id === product?.vendorId);
          return {
            ...item,
            product,
            vendor,
            lineTotalUsd: (product?.priceUsd || 0) * item.qty
          };
        }).filter(i => i.product);

        const subtotalUsd = enriched.reduce((acc, i) => acc + i.lineTotalUsd, 0);
        const platformFeeUsd = subtotalUsd * 0.025; // 2.5% NexusCart Platform Fee

        // Calculate 97.5% split per vendor
        const vendorSplits = {};
        enriched.forEach(item => {
          if (!item.vendor) return;
          const vid = item.vendor.id;
          if (!vendorSplits[vid]) {
            vendorSplits[vid] = {
              vendorId: vid,
              vendorName: item.vendor.name,
              stripeAccountId: item.vendor.stripeAccountId,
              grossUsd: 0,
              netPayoutUsd: 0,
              itemCount: 0
            };
          }
          vendorSplits[vid].grossUsd += item.lineTotalUsd;
          vendorSplits[vid].netPayoutUsd += item.lineTotalUsd * 0.975;
          vendorSplits[vid].itemCount += item.qty;
        });

        return {
          items: enriched,
          totalCount: enriched.reduce((sum, i) => sum + i.qty, 0),
          subtotalUsd,
          platformFeeUsd,
          vendorSplits: Object.values(vendorSplits)
        };
      }, [cart, products, vendors]);

      // Cart Mutations
      const addToCart = (productId, qty = 1) => {
        const prod = products.find(p => p.id === productId);
        if (!prod || prod.stock <= 0) {
          triggerToast('Item is out of stock!', 'error');
          return;
        }
        setCart(prev => {
          const existing = prev.find(i => i.productId === productId);
          if (existing) {
            const nextQty = Math.min(prod.stock, existing.qty + qty);
            return prev.map(i => i.productId === productId ? { ...i, qty: nextQty } : i);
          }
          return [...prev, { productId, qty: Math.min(prod.stock, qty) }];
        });
        triggerToast(`Added "${prod.title}" to unified cart.`);
      };

      const updateCartQty = (productId, delta) => {
        const prod = products.find(p => p.id === productId);
        setCart(prev => prev.map(item => {
          if (item.productId !== productId) return item;
          const nextQty = item.qty + delta;
          if (nextQty <= 0) return null;
          const maxStock = prod ? prod.stock : 999;
          return { ...item, qty: Math.min(maxStock, nextQty) };
        }).filter(Boolean));
      };

      const removeCartItem = (productId) => {
        setCart(prev => prev.filter(i => i.productId !== productId));
        triggerToast('Removed item from cart.');
      };

      // Checkout Execution with Stripe Connect Split Simulation
      const handleStripeSplitCheckout = () => {
        if (cartDetails.items.length === 0) return;
        setCheckoutStep('processing');

        setTimeout(() => {
          // Deduct Stock
          setProducts(prev => prev.map(p => {
            const inCart = cart.find(c => c.productId === p.id);
            if (!inCart) return p;
            return { ...p, stock: Math.max(0, p.stock - inCart.qty) };
          }));

          const randomOrderNumber = `NX-${Math.floor(10000 + Math.random() * 90000)}`;
          const trackingNumber = `DHL-EXP-${Math.floor(10000000 + Math.random() * 90000000)}`;

          const newOrder = {
            id: randomOrderNumber,
            createdAt: new Date().toUTCString().replace('GMT', 'UTC'),
            customerEmail: checkoutCustomerEmail || 'customer@nexuscart.dev',
            stepIndex: 0,
            refunded: false,
            currency: currency,
            trackingNumber: trackingNumber,
            totalUsd: cartDetails.subtotalUsd,
            platformFeeUsd: cartDetails.platformFeeUsd,
            vendorSplits: cartDetails.vendorSplits,
            items: cartDetails.items.map(i => ({
              title: i.product.title,
              qty: i.qty,
              priceUsd: i.product.priceUsd,
              vendorId: i.vendor.id,
              vendorName: i.vendor.name
            }))
          };

          setOrders(prev => [newOrder, ...prev]);
          setCart([]);
          setCheckoutStep(null);
          setIsCartOpen(false);
          setActiveView('orders');
          triggerToast(`Success! Order ${newOrder.id} settled & routed to ${cartDetails.vendorSplits.length} Stripe account(s).`);
        }, 1200);
      };

      // Vendor Portal Mutations
      const updateProductStock = (productId, newStock) => {
        const val = Math.max(0, parseInt(newStock) || 0);
        setProducts(prev => prev.map(p => p.id === productId ? { ...p, stock: val } : p));
      };

      const updateProductPrice = (productId, newPrice) => {
        const val = Math.max(1, parseFloat(newPrice) || 1);
        setProducts(prev => prev.map(p => p.id === productId ? { ...p, priceUsd: val } : p));
      };

      const deleteVendorProduct = (productId) => {
        const prod = products.find(p => p.id === productId);
        if (window.confirm(`Deactivate and remove SKU "${prod?.title}" from catalog?`)) {
          setProducts(prev => prev.filter(p => p.id !== productId));
          setCart(prev => prev.filter(i => i.productId !== productId));
          triggerToast(`SKU removed from active MeiliSearch catalog.`);
        }
      };

      const handleCreateVendorProduct = (e) => {
        e.preventDefault();
        const created = {
          id: `prod_${Date.now()}`,
          sku: newProdForm.sku.trim().toUpperCase() || `SKU-${Math.floor(100 + Math.random() * 899)}`,
          title: newProdForm.title.trim() || 'New Custom Merchant SKU',
          vendorId: managedVendorId,
          category: newProdForm.category,
          priceUsd: Number(newProdForm.priceUsd) || 150,
          stock: Number(newProdForm.stock) || 10,
          rating: 5.0,
          reviews: 1,
          image: newProdForm.image,
          specs: newProdForm.specsStr.split(',').map(s => s.trim()).filter(Boolean)
        };
        setProducts(prev => [created, ...prev]);
        setShowAddProductModal(false);
        setNewProdForm({
          title: '',
          sku: '',
          category: 'Audio',
          priceUsd: 199,
          stock: 25,

import Stripe from 'stripe';
const stripe = new Stripe(process.env.STRIPE_SECRET_KEY);

export async function POST(req) {
  const { cart, customerEmail } = await req.json();
  const transferGroupId = \`ORDER_\${Date.now()}_\${Math.random().toString(36).substring(7)}\`;

    metadata: { platform: 'NexusCart_Headless', platformFeePercent: '2.5%' }

  for (const split of cart.vendorSplits) {

      amount: netPayoutCents,

      destination: split.stripeAccountId, // e.g. acct_aether_99x
      transfer_group: transferGroupId,
      description: \`NexusCart Settlement for \${split.vendorName}\`
    });
  }

  return Response.json({ success: true, transferGroupId });
}`}
